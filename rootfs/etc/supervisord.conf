; gamestream – folyamatfelügyelet. Minden szolgáltatás a "gamer" felhasználóként fut.
; Állapot a konténerben: supervisorctl status

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
; csoport-írható fájlok: a megosztás csoportja (pl. SMB-n) is módosíthatja, amit a konténer létrehoz
umask=002

[program:dbus]
command=/usr/bin/dbus-daemon --session --address=unix:path=%(ENV_XDG_RUNTIME_DIR)s/bus --nofork --nopidfile --nosyslog
user=gamer
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:pipewire]
command=/usr/bin/pipewire
user=gamer
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:wireplumber]
command=/bin/sh -c 'while [ ! -S "$XDG_RUNTIME_DIR/pipewire-0" ]; do sleep 0.5; done; exec /usr/bin/wireplumber'
user=gamer
priority=21
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:pipewire-pulse]
command=/bin/sh -c 'while [ ! -S "$XDG_RUNTIME_DIR/pipewire-0" ]; do sleep 0.5; done; exec /usr/bin/pipewire-pulse'
user=gamer
priority=22
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:labwc]
command=/usr/local/bin/gs-labwc
user=gamer
priority=30
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:sunshine]
command=/usr/local/bin/gs-sunshine
user=gamer
priority=40
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:wayvnc]
command=/usr/local/bin/gs-wayvnc
user=gamer
priority=41
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
command=/usr/local/bin/gs-novnc
user=gamer
priority=42
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:romm-sync]
; RetroArch <-> RomM mentésszinkron (romm-sync watch); párosításig csak vár
command=/usr/local/bin/gs-romm-sync
user=gamer
priority=50
autorestart=true
startsecs=0
stopsignal=TERM
; a jel a teljes folyamatcsoportnak megy, így a romm-sync sem marad árván
stopasgroup=true
killasgroup=true
; egy épp futó szinkron befejeződhet leállítás előtt
stopwaitsecs=300
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
