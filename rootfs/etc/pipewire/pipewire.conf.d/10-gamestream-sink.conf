# Állandó virtuális hangkimenet: hang nélküli szerveren is legyen alapértelmezett eszköz,
# különben egyes játékok hiba nélkül összeomlanak. A Sunshine stream közben a sajátját használja.
context.objects = [
  { factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = "gamestream-sink"
      node.description = "Gamestream virtuális kimenet"
      media.class      = "Audio/Sink"
      audio.position   = [ FL FR ]
      monitor.channel-volumes = true
    }
  }
]
