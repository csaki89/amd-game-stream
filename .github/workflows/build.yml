# Image build és feltöltés a GHCR-ra: ghcr.io/csaki89/amd-game-stream
# - minden push a main ágra
# - hetente egyszer (az Arch gördülő frissítései miatt: friss csomagok + korai hibajelzés)
# - kézzel: Actions fül → build → Run workflow
name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - ".gitattributes"
  schedule:
    - cron: "0 3 * * 1"   # hétfő 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,format=short

      # Szándékosan cache nélkül: az Arch-alapnál a cache-elt "pacman -Syu" réteg elavult csomagokat tartana meg.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
